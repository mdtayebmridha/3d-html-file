<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Nodes - Scroll Animation</title>
    <style>
        /* 기본 (Base) Reset */
        body {
            margin: 0;
            background-color: #050505;
            font-family: 'Inter', sans-serif;
            color: white;
            /* Hide horizontal scroll, allow vertical scroll */
            overflow-x: hidden; 
        }

        /* 3D Canvas Fixed Background */
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed; /* Fix to viewport */
            top: 0;
            left: 0;
            z-index: -1; /* Place behind content */
            pointer-events: none; /* Let user click on website content */
        }

        /* Dummy Website Sections */
        .section {
            /* Each section is the exact height of the screen */
            height: 100vh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .section h1 {
            font-size: 5rem;
            font-weight: 300;
            margin: 0;
            letter-spacing: 15px;
            text-transform: uppercase;
            text-shadow: 0px 4px 15px rgba(0,0,0,0.8);
        }

        .section p {
            font-size: 1.2rem;
            color: #aaa;
            letter-spacing: 3px;
            margin-top: 20px;
            max-width: 600px;
            text-shadow: 0px 2px 10px rgba(0,0,0,0.8);
        }

        /* Responsive font size */
        @media (max-width: 768px) {
            .section h1 { font-size: 3rem; letter-spacing: 5px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 3D Background -->
    <div id="canvas-container"></div>

    <!-- Website Content -->
    <div class="section">
        <h1>Connect</h1>
        <p>Scroll down to dive deep into the network.</p>
    </div>
    
    <div class="section">
        <h1>Explore</h1>
        <p>As you scroll, the camera physically moves forward inside the 3D space, creating a highly immersive experience.</p>
    </div>
    
    <div class="section">
        <h1>Discover</h1>
        <p>Perfect for modern AI, Tech, and Next-Gen product landing pages.</p>
    </div>
    
    <div class="section">
        <h1>Join Us</h1>
        <p>Reach the core of the network.</p>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.0025);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 2000);
        // Base camera starting position
        const baseCameraZ = 350;
        camera.position.z = baseCameraZ;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // --- Network Nodes Setup ---
        const particleCount = 400;
        const maxDistance = 75;
        
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        // Distribute nodes in a deep 3D space so we have room to travel through them
        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 800;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 800;
            // Z depth is spread out so we can fly through it!
            positions[i * 3 + 2] = (Math.random() - 0.5) * 1200; 

            velocities.push({
                x: (Math.random() - 0.5) * 1.0,
                y: (Math.random() - 0.5) * 1.0,
                z: (Math.random() - 0.5) * 1.0
            });
        }

        const particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const canvas = document.createElement('canvas');
        canvas.width = 32;
        canvas.height = 32;
        const context = canvas.getContext('2d');
        context.beginPath();
        context.arc(16, 16, 14, 0, Math.PI * 2);
        context.fillStyle = '#00f2fe';
        context.fill();
        const texture = new THREE.CanvasTexture(canvas);

        const particleMaterial = new THREE.PointsMaterial({
            color: 0x00f2fe,
            size: 6,
            map: texture,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        const linesGeometry = new THREE.BufferGeometry();
        const linesMaterial = new THREE.LineBasicMaterial({
            color: 0x00f2fe,
            transparent: true,
            opacity: 0.25,
            blending: THREE.AdditiveBlending
        });

        const linesMesh = new THREE.LineSegments(linesGeometry, linesMaterial);
        scene.add(linesMesh);

        // --- Mouse & Scroll Interaction ---
        let targetX = 0, targetY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;
        
        // Track Scroll Position
        let scrollY = window.scrollY;

        document.addEventListener('mousemove', (event) => {
            targetX = (event.clientX - windowHalfX) * 0.2; // Reduced mouse effect slightly
            targetY = (event.clientY - windowHalfY) * 0.2;
        });

        document.addEventListener('scroll', () => {
            scrollY = window.scrollY;
        });

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // --- Scroll-Tied Camera Logic ---
            // As scrollY increases (user scrolls down), targetZ decreases (camera zooms forward into the scene)
            const targetZ = baseCameraZ - (scrollY * 0.25);
            
            // Smoothly move the camera forward/backward based on scroll
            camera.position.z += (targetZ - camera.position.z) * 0.05;
            
            // Mouse movement pans the camera left/right slightly
            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.y += (-targetY - camera.position.y) * 0.05;
            
            // Slightly rotate the entire scene based on scroll to make it dynamic
            scene.rotation.x = scrollY * 0.0002;
            scene.rotation.y += 0.001; // Auto rotation

            camera.lookAt(scene.position);

            const posArray = particleGeometry.attributes.position.array;
            let linePositions = [];

            // Move Nodes
            for (let i = 0; i < particleCount; i++) {
                posArray[i * 3] += velocities[i].x;
                posArray[i * 3 + 1] += velocities[i].y;
                posArray[i * 3 + 2] += velocities[i].z;

                // Bounce
                if (posArray[i * 3] < -400 || posArray[i * 3] > 400) velocities[i].x *= -1;
                if (posArray[i * 3 + 1] < -400 || posArray[i * 3 + 1] > 400) velocities[i].y *= -1;
                if (posArray[i * 3 + 2] < -600 || posArray[i * 3 + 2] > 600) velocities[i].z *= -1;
            }
            particleGeometry.attributes.position.needsUpdate = true;

            // Connect lines
            for (let i = 0; i < particleCount; i++) {
                for (let j = i + 1; j < particleCount; j++) {
                    const dx = posArray[i * 3] - posArray[j * 3];
                    const dy = posArray[i * 3 + 1] - posArray[j * 3 + 1];
                    const dz = posArray[i * 3 + 2] - posArray[j * 3 + 2];
                    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

                    if (dist < maxDistance) {
                        linePositions.push(
                            posArray[i * 3], posArray[i * 3 + 1], posArray[i * 3 + 2],
                            posArray[j * 3], posArray[j * 3 + 1], posArray[j * 3 + 2]
                        );
                    }
                }
            }
            linesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
