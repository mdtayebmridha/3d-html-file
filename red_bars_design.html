<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract Red Light Lines 3D</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100vh;
            background-color: #08080a; /* Very dark background */
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Container that we will rotate with the mouse for 3D effect */
        #scene {
            position: absolute;
            width: 100vw; height: 100vh;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        /* Group for all the bars to angle them together */
        .bars-group {
            position: absolute;
            left: -10vw;
            bottom: -20vh;
            width: 80vw;
            height: 100vh;
            /* Rotate to match the 45-degree angle from bottom-left to top-right */
            transform: rotate(45deg) translateZ(0);
            transform-style: preserve-3d;
        }

        /* Individual Bar */
        .bar {
            position: absolute;
            background: linear-gradient(90deg, #111, #1a1a1a);
            border-radius: 2px;
            /* The neon red glowing edges */
            border-top: 1.5px solid #ff0033;
            border-right: 1.5px solid #ff0033;
            border-bottom: 1px solid rgba(0,0,0,0.8);
            border-left: 1px solid rgba(0,0,0,0.8);
            /* Glow and Drop Shadow */
            box-shadow: 
                2px -2px 15px rgba(255, 0, 51, 0.4), /* Red Glow */
                inset 2px -2px 10px rgba(255, 0, 51, 0.1), /* Inner Glow */
                15px 25px 30px rgba(0, 0, 0, 0.9); /* Deep 3D Shadow */
            transform-style: preserve-3d;
            /* Animation for subtle floating */
            animation: floatBar 4s infinite alternate ease-in-out;
        }

        @keyframes floatBar {
            0% { transform: translateZ(0px); }
            100% { transform: translateZ(20px); }
        }

        /* Recreating the specific layout of the bars from the image */
        /* Bar 1: Top-most */
        .bar-1 { top: 20%; left: 10%; width: 50vw; height: 3.5vw; animation-delay: 0s; z-index: 10; }
        /* Bar 2: Below Bar 1, slightly shorter */
        .bar-2 { top: 32%; left: 0%; width: 45vw; height: 3.5vw; animation-delay: 0.2s; z-index: 9; }
        /* Bar 3 */
        .bar-3 { top: 44%; left: -5%; width: 60vw; height: 3.5vw; animation-delay: 0.4s; z-index: 8; }
        /* Bar 4 */
        .bar-4 { top: 56%; left: 5%; width: 40vw; height: 3.5vw; animation-delay: 0.6s; z-index: 7; }
        /* Bar 5 */
        .bar-5 { top: 68%; left: -10%; width: 55vw; height: 3.5vw; animation-delay: 0.8s; z-index: 6; }
        /* Bar 6: Bottom-most */
        .bar-6 { top: 80%; left: 15%; width: 35vw; height: 3.5vw; animation-delay: 1.0s; z-index: 5; }

        /* UI Overlay to make it a complete design */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            padding-right: 10vw;
            box-sizing: border-box;
            z-index: 100;
            color: white;
        }

        .title {
            font-size: 5vw;
            font-weight: 900;
            margin: 0;
            letter-spacing: -2px;
            text-transform: uppercase;
            text-align: right;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .title span {
            color: #ff0033;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 5px;
            color: #aaa;
            text-transform: uppercase;
            margin-top: 10px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="scene">
        <div class="bars-group">
            <div class="bar bar-1"></div>
            <div class="bar bar-2"></div>
            <div class="bar bar-3"></div>
            <div class="bar bar-4"></div>
            <div class="bar bar-5"></div>
            <div class="bar bar-6"></div>
        </div>
    </div>

    <div class="overlay">
        <h1 class="title">Neon<br><span>Velocity</span></h1>
        <div class="subtitle">Next-Gen Interface</div>
    </div>

    <script>
        // Add 3D Mouse Parallax Effect
        const scene = document.getElementById('scene');
        
        document.addEventListener('mousemove', (e) => {
            // Calculate mouse position relative to center of screen (-1 to 1)
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            // Rotate the entire scene based on mouse position to create a 3D effect
            scene.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Reset transform when mouse leaves
        document.addEventListener('mouseleave', () => {
            scene.style.transition = 'transform 0.5s ease-out';
            scene.style.transform = `rotateY(0deg) rotateX(0deg)`;
            setTimeout(() => {
                scene.style.transition = 'transform 0.1s ease-out';
            }, 500);
        });
    </script>
</body>
</html>
