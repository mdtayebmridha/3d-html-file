<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle Wave - Scroll Animation</title>
    <style>
        body {
            margin: 0;
            overflow-x: hidden;
            background-color: #0d0e15;
            font-family: 'Inter', sans-serif;
            color: white;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }
        .section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }
        .section h1 {
            font-size: 6rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: 10px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #a0c0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.5));
        }
        .section p {
            font-size: 1.2rem;
            color: #aaa;
            letter-spacing: 3px;
            margin-top: 20px;
            max-width: 600px;
            text-shadow: 0px 2px 10px rgba(0,0,0,0.8);
        }
        @media (max-width: 768px) {
            .section h1 { font-size: 3rem; letter-spacing: 5px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="section">
        <h1>Digital Ocean</h1>
        <p>Scroll down to dive into the wave</p>
    </div>
    <div class="section">
        <h1>Fluidity</h1>
        <p>The camera dips beneath the surface as you scroll</p>
    </div>
    <div class="section">
        <h1>Immersion</h1>
        <p>Dynamic 3D depth experience</p>
    </div>
    <div style="height: 50vh;"></div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0d0e15, 0.003);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
        const baseY = 150;
        const baseZ = 400;
        camera.position.set(0, baseY, baseZ);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // --- Particle Wave Creation ---
        const SEPARATION = 40;
        const AMOUNTX = 100;
        const AMOUNTY = 100;
        const numParticles = AMOUNTX * AMOUNTY;
        
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(numParticles * 3);
        const scales = new Float32Array(numParticles);
        
        let i = 0, j = 0;
        for ( let ix = 0; ix < AMOUNTX; ix ++ ) {
            for ( let iy = 0; iy < AMOUNTY; iy ++ ) {
                positions[ i ] = ix * SEPARATION - ( ( AMOUNTX * SEPARATION ) / 2 );
                positions[ i + 1 ] = 0;
                positions[ i + 2 ] = iy * SEPARATION - ( ( AMOUNTY * SEPARATION ) / 2 );
                scales[ j ] = 1;
                i += 3;
                j ++;
            }
        }
        
        geometry.setAttribute( 'position', new THREE.BufferAttribute( positions, 3 ) );
        geometry.setAttribute( 'scale', new THREE.BufferAttribute( scales, 1 ) );

        const material = new THREE.ShaderMaterial( {
            uniforms: {
                color: { value: new THREE.Color( 0x00f2fe ) },
            },
            vertexShader: `
                attribute float scale;
                void main() {
                    vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );
                    gl_PointSize = scale * ( 200.0 / - mvPosition.z );
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform vec3 color;
                void main() {
                    float dist = length( gl_PointCoord - vec2( 0.5, 0.5 ) );
                    if ( dist > 0.475 ) discard;
                    float intensity = 1.0 - (dist * 2.0);
                    gl_FragColor = vec4( color, intensity );
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        } );

        const particles = new THREE.Points( geometry, material );
        scene.add( particles );

        // --- Mouse & Scroll Interaction ---
        let mouseX = 0;
        let mouseY = 0;
        let scrollY = window.scrollY;
        
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = event.clientX - windowHalfX;
            mouseY = event.clientY - windowHalfY;
        });

        document.addEventListener('scroll', () => {
            scrollY = window.scrollY;
        });

        // --- Animation Loop ---
        let count = 0;
        function animate() {
            requestAnimationFrame(animate);

            // SCROLL EFFECT: As user scrolls, camera dips lower (close to wave) and zooms forward
            const targetY = Math.max(30, baseY - (scrollY * 0.1)); // Don't go below the wave
            const targetZ = baseZ - (scrollY * 0.15);
            
            camera.position.x += (mouseX * 0.3 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 0.2 + targetY - camera.position.y) * 0.05;
            camera.position.z += (targetZ - camera.position.z) * 0.05;
            camera.lookAt(0, 0, 0);

            // Update particle wave
            const posAttr = particles.geometry.attributes.position.array;
            const scAttr = particles.geometry.attributes.scale.array;

            let idx = 0, jdx = 0;
            for ( let ix = 0; ix < AMOUNTX; ix ++ ) {
                for ( let iy = 0; iy < AMOUNTY; iy ++ ) {
                    posAttr[ idx + 1 ] = ( Math.sin( ( ix + count ) * 0.3 ) * 30 ) +
                                         ( Math.sin( ( iy + count ) * 0.5 ) * 30 );
                    
                    scAttr[ jdx ] = ( Math.sin( ( ix + count ) * 0.3 ) + 1 ) * 3 +
                                    ( Math.sin( ( iy + count ) * 0.5 ) + 1 ) * 3;
                    idx += 3;
                    jdx ++;
                }
            }

            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.scale.needsUpdate = true;
            
            count += 0.05;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
