<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Slide - Luxury Minimal</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100vh;
            background-color: #0c0c0c;
            font-family: 'Playfair Display', serif;
            color: #d4af37; /* Soft gold */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient Grain Texture */
        .noise {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.05;
            z-index: 2;
            pointer-events: none;
        }

        /* Ambient Blur Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 1;
            opacity: 0.4;
            animation: float 10s infinite alternate ease-in-out;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: #4a2b2b;
            top: -10%; left: 10%;
        }
        .orb-2 {
            width: 500px; height: 500px;
            background: #1a2a3a;
            bottom: -20%; right: 10%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Content Container */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: #888;
        }

        .title {
            font-size: 8vw;
            font-weight: 400;
            margin: 0;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #fff, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desc {
            margin-top: 30px;
            max-width: 450px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: #666;
            line-height: 1.8;
            font-weight: 300;
        }

        .line {
            width: 1px;
            height: 80px;
            background: #d4af37;
            margin-top: 40px;
            opacity: 0.5;
        }

        /* Elegant Frame */
        .frame {
            position: absolute;
            top: 30px; left: 30px; right: 30px; bottom: 30px;
            border: 1px solid rgba(255,255,255,0.05);
            z-index: 5;
            pointer-events: none;
        }

        .frame-text {
            position: absolute;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: #555;
            text-transform: uppercase;
        }
        .ft-top { top: -10px; left: 50%; transform: translateX(-50%); background: #0c0c0c; padding: 0 15px; }
        .ft-bottom { bottom: -10px; left: 50%; transform: translateX(-50%); background: #0c0c0c; padding: 0 15px; }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300&display=swap" rel="stylesheet">
</head>
<body>

    <div class="noise"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="frame">
        <div class="frame-text ft-top">Est. 2026</div>
        <div class="frame-text ft-bottom">O-I Collection</div>
    </div>

    <div class="content">
        <div class="subtitle">Exclusive Edition</div>
        <h1 class="title">Elegance</h1>
        <p class="desc">A deeply luxurious minimal dark mode aesthetic. Featuring classic serif typography, cinematic grain, and soft ambient light blending.</p>
        <div class="line"></div>
    </div>

</body>
</html>
