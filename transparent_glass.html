<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Transparent Glass</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            /* Make it scrollable */
            height: 400vh;
            background-color: #050505;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed; /* Keep 3D scene fixed in background */
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Glassmorphism UI */
        .glass-ui {
            position: fixed; /* Keep card fixed on screen */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 50px;
            text-align: center;
            color: white;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            pointer-events: none;
            transition: opacity 0.5s ease;
            width: 300px;
        }

        .glass-ui h1 {
            margin: 0 0 10px 0;
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 15px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.5s ease;
        }

        .glass-ui p {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 4px;
            color: #9ca3af;
            text-transform: uppercase;
        }

        /* Scroll Indicator */
        .scroll-indicator {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: white;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .mouse {
            width: 25px; height: 40px;
            border: 2px solid white; border-radius: 15px;
            position: relative;
        }
        .wheel {
            width: 4px; height: 8px;
            background: white; border-radius: 2px;
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            animation: scroll-anim 1.5s infinite;
        }
        @keyframes scroll-anim {
            0% { transform: translate(-50%, 0); opacity: 1; }
            100% { transform: translate(-50%, 15px); opacity: 0; }
        }

        @media (max-width: 768px) {
            .glass-ui h1 { font-size: 1.8rem; letter-spacing: 8px; }
            .glass-ui p { font-size: 0.8rem; letter-spacing: 2px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="canvas-container"></div>

    <div class="glass-ui" id="ui-card">
        <h1 id="ui-title">Prism</h1>
        <p id="ui-desc">Interactive Glass</p>
    </div>

    <div class="scroll-indicator" id="scroll-ind">
        <span>Scroll Down</span>
        <div class="mouse"><div class="wheel"></div></div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const uiTitle = document.getElementById('ui-title');
        const uiDesc = document.getElementById('ui-desc');
        const uiCard = document.getElementById('ui-card');
        const scrollInd = document.getElementById('scroll-ind');

        // Scene, Camera, Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // Background Orbs
        const bgGroup = new THREE.Group();
        scene.add(bgGroup);

        const createOrb = (color, size, x, y, z) => {
            const geo = new THREE.SphereGeometry(size, 32, 32);
            const mat = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            bgGroup.add(mesh);
            return mesh;
        };

        const orb1 = createOrb(0xff0055, 1.5, -4, 3, -5); // Pink
        const orb2 = createOrb(0x00f0ff, 2, 5, -2, -6);   // Cyan
        const orb3 = createOrb(0x7000ff, 1, -2, -4, -4);  // Purple
        const orb4 = createOrb(0xffaa00, 1.2, 3, 4, -7);  // Orange

        // The Transparent Glass Object (Torus Knot)
        const glassGeometry = new THREE.TorusKnotGeometry(1.2, 0.4, 128, 64);
        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0.1,
            roughness: 0.05,
            transmission: 1.0,
            ior: 1.5,
            thickness: 1.5,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            side: THREE.DoubleSide
        });

        const glassMesh = new THREE.Mesh(glassGeometry, glassMaterial);
        scene.add(glassMesh);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const pointLight1 = new THREE.PointLight(0xff0055, 2, 20);
        const pointLight2 = new THREE.PointLight(0x00f0ff, 2, 20);
        scene.add(pointLight1);
        scene.add(pointLight2);

        // Scroll Logic
        let currentScroll = 0;
        let targetScroll = 0;

        window.addEventListener('scroll', () => {
            targetScroll = window.scrollY;
        });

        // Mouse Parallax
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Smooth scroll interpolation
            currentScroll += (targetScroll - currentScroll) * 0.08;
            
            // Calculate progress (0 to 1) over 300vh
            const maxScroll = document.body.offsetHeight - window.innerHeight;
            let progress = currentScroll / maxScroll;
            if (progress < 0) progress = 0;
            if (progress > 1) progress = 1;

            // Animate Glass Object based on SCROLL
            // It spins faster and comes closer as you scroll down
            glassMesh.rotation.x = progress * Math.PI * 4; // Rotates twice fully
            glassMesh.rotation.y = progress * Math.PI * 4;
            
            // Camera zoom effect based on scroll
            camera.position.z = 8 - (progress * 5); // Zooms from z=8 to z=3

            // Mouse parallax on top of scroll rotation
            targetX = mouseX * 0.001;
            targetY = mouseY * 0.001;
            glassMesh.rotation.x += 0.05 * (targetY);
            glassMesh.rotation.y += 0.05 * (targetX);

            // Change UI text based on scroll progress
            if (progress < 0.3) {
                uiTitle.innerText = "PRISM";
                uiDesc.innerText = "Interactive Glass";
                scrollInd.style.opacity = 1 - (progress * 3); // fade out scroll indicator
            } else if (progress >= 0.3 && progress < 0.7) {
                uiTitle.innerText = "REFRACT";
                uiDesc.innerText = "Bend the Light";
                scrollInd.style.opacity = 0;
            } else {
                uiTitle.innerText = "SHATTER";
                uiDesc.innerText = "Push the limits";
            }

            // Pulse the glass card size based on scroll
            const scale = 1 + Math.sin(progress * Math.PI) * 0.1;
            uiCard.style.transform = `translate(-50%, -50%) scale(${scale})`;

            // Orbit lights automatically
            pointLight1.position.set(
                Math.sin(elapsedTime) * 4,
                Math.cos(elapsedTime * 0.5) * 4,
                Math.sin(elapsedTime * 0.8) * 4
            );
            pointLight2.position.set(
                Math.cos(elapsedTime * 1.2) * 4,
                Math.sin(elapsedTime * 0.6) * 4,
                Math.cos(elapsedTime * 0.9) * 4
            );

            // Animate Orbs
            orb1.position.y = 3 + Math.sin(elapsedTime * 0.5 + progress * 5) * 1;
            orb2.position.x = 5 + Math.cos(elapsedTime * 0.3 + progress * 5) * 1.5;
            orb3.position.y = -4 + Math.sin(elapsedTime * 0.8 + progress * 5) * 1;
            orb4.position.z = -7 + Math.cos(elapsedTime * 0.4 + progress * 5) * 2;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
